# Publishes the widget, demo store (/demo-store.html) and Garment Studio (/studio/) to
# GitHub Pages (https), so they can be opened on any phone.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# Note: free GitHub Pages needs a public repository; for a private one use Cloudflare Pages
# (docs/testing-guide.md).
name: Deploy demo

on:
  push:
    branches: [main, claude/virtual-clothing-try-on-v2wftm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/widget/dist
      - id: deployment
        uses: actions/deploy-pages@v4
